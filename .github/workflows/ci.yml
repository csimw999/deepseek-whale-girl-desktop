name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  syntax:
    name: 语法与配置检查
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 检查主进程与预加载脚本
        shell: bash
        run: |
          set -e
          for f in main.js preload.js preload-chat.js preload-settings.js preload-voice.js app/host.js app/overlay.js app/loader.js app/pets-defs.js; do
            if [ -f "$f" ]; then
              echo "check $f"
              node --check "$f"
            fi
          done

      - name: 检查打包脚本
        shell: bash
        run: |
          set -e
          for f in tools/pack-portable.cjs tools/pack-models.cjs tools/build-win.cjs; do
            [ -f "$f" ] && node --check "$f"
          done

      - name: 校验 JSON
        shell: bash
        run: |
          set -e
          node -e "JSON.parse(require('fs').readFileSync('package.json','utf8')); console.log('package.json ok')"
          node -e "JSON.parse(require('fs').readFileSync('live2d/model/c_0120.model3.json','utf8')); console.log('model3.json ok')"

      - name: 确认没有误提交大文件
        shell: bash
        run: |
          set -e
          node -e "
            const { execSync } = require('child_process');
            const fs = require('fs');
            const files = execSync('git ls-files', { encoding: 'utf8' }).split('\n').filter(Boolean);
            const big = files.map(f => [f, fs.statSync(f).size]).filter(([, s]) => s > 5 * 1024 * 1024);
            if (big.length) {
              console.log('以下文件超过 5 MB，请确认是否应该进仓库：');
              for (const [f, s] of big) console.log(' ', f, (s / 1048576).toFixed(1) + ' MB');
              process.exit(1);
            }
            console.log('ok：仓库里没有 >5 MB 的文件');
          "

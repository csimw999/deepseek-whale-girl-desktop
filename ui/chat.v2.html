<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>和鲸鱼娘聊天</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #0a0f1c; --panel: #0e1523; --panel-2: #121a2c;
    --line: rgba(126,152,255,.13); --line-strong: rgba(126,152,255,.28);
    --text: #e8edfa; --muted: #8797b8; --accent: #4f6df5; --ok: #34d399;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; overflow: hidden; background: var(--bg); color: var(--text);
    font: 14px/1.7 "Microsoft YaHei UI", "Segoe UI", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  button, select, textarea, input { font: inherit; color: inherit; }
  button { cursor: pointer; }

  aside {
    width: 236px; flex: none; display: flex; flex-direction: column; gap: 12px;
    background: linear-gradient(180deg, #0f1728, #0b1220);
    border-right: 1px solid var(--line); padding: 20px 16px; overflow-y: auto;
  }
  .avatar {
    width: 74px; height: 74px; border-radius: 22px; align-self: center; font-size: 34px;
    display: flex; align-items: center; justify-content: center;
    background: linear-gradient(160deg, #24345f, #131c30);
    border: 1px solid var(--line-strong); box-shadow: 0 8px 24px rgba(5,10,25,.55);
  }
  .name { text-align: center; font-size: 16px; font-weight: 600; letter-spacing: .3px; }
  .tagline { text-align: center; font-size: 11.5px; line-height: 1.6; color: var(--muted); white-space: pre-line; }
  .hr { height: 1px; background: var(--line); margin: 2px 0; }
  .field { display: flex; flex-direction: column; gap: 5px; }
  .field > span { font-size: 11px; color: var(--muted); letter-spacing: .4px; }
  select, input, textarea {
    width: 100%; background: var(--panel-2); border: 1px solid transparent;
    border-radius: 8px; padding: 6px 8px; outline: none; font-size: 12.5px;
    transition: box-shadow .18s, background .18s;
  }
  select:hover, input:hover, textarea:hover { background: #16203a; }
  select:focus-visible, input:focus-visible, textarea:focus-visible, button:focus-visible {
    box-shadow: 0 0 0 3px rgba(79, 109, 245, .35); border-color: transparent; outline: none;
  }
  textarea { resize: vertical; min-height: 52px; line-height: 1.55; }
  .btn {
    display: flex; align-items: center; justify-content: center; gap: 6px;
    background: var(--panel-2); border: none; border-radius: 9px; padding: 8px 10px;
    font-size: 12.5px; transition: background .16s, transform .12s, box-shadow .16s;
    box-shadow: 0 1px 2px rgba(3,7,18,.35);
  }
  .btn:hover { background: #1a2440; box-shadow: 0 4px 14px rgba(3,7,18,.3); }
  .btn:active { transform: translateY(1px); background: #151d33; }
  .btn:disabled { opacity: .45; cursor: default; }
  .btn.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.ghost { background: transparent; }
  .btn-row { display: flex; gap: 8px; }
  .btn-row .btn { flex: 1; }
  .note { font-size: 11px; color: #5f6d8f; line-height: 1.6; }

  main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  header {
    height: 56px; flex: none; display: flex; align-items: center; gap: 10px; padding: 0 24px;
    border-bottom: 1px solid rgba(126,152,255,.08); background: rgba(12,18,31,.86);
    backdrop-filter: blur(12px); position: relative; z-index: 2;
    box-shadow: 0 1px 0 rgba(255,255,255,.03), 0 12px 28px rgba(3,7,18,.28);
  }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 8px var(--ok); }
  header .title { font-size: 13px; color: #b8c6e6; }
  header .spacer { flex: 1; }
  header .chip, .swipe, .stat b { font-variant-numeric: tabular-nums; }
  header .chip {
    font-size: 11px; color: var(--muted); border: 1px solid var(--line-strong);
    border-radius: 999px; padding: 2px 10px;
  }

  #log { flex: 1; overflow-y: auto; padding: 22px 24px 8px; display: flex; flex-direction: column; gap: 16px; }
  #log { scrollbar-width: thin; scrollbar-color: #2a3452 transparent; }
  #log::-webkit-scrollbar { width: 10px; }
  #log::-webkit-scrollbar-track { background: transparent; margin: 14px 0; }
  #log::-webkit-scrollbar-thumb {
    background: linear-gradient(180deg, #2b3550, #1e2740);
    border-radius: 999px; border: 3px solid transparent; background-clip: padding-box;
  }
  #log::-webkit-scrollbar-thumb:hover { background: #3a4a72; background-clip: padding-box; }

  .empty { margin: auto; text-align: center; color: var(--muted); display: flex; flex-direction: column; gap: 8px; align-items: center; }
  .empty .big { font-size: 46px; opacity: .85; }
  .empty .line { font-size: 13px; max-width: 320px; line-height: 1.8; }

  .msg { display: flex; gap: 10px; max-width: 78%; position: relative; }
  .msg.me { align-self: flex-end; flex-direction: row-reverse; }
  .face {
    width: 30px; height: 30px; border-radius: 10px; flex: none; margin-top: 2px; font-size: 13px;
    display: flex; align-items: center; justify-content: center;
    background: linear-gradient(160deg, #24345f, #131c30); border: 1px solid var(--line-strong);
  }
  .msg.me .face { background: linear-gradient(160deg, #3d55c9, #2a3a94); border-color: #4f6df5; }
  .col { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .bubble {
    padding: 10px 14px; border-radius: 14px; white-space: pre-wrap; word-break: break-word;
    background: var(--panel-2); font-size: 13.5px; line-height: 1.72;
    box-shadow: 0 1px 2px rgba(3, 7, 18, .35), 0 8px 24px rgba(3, 7, 18, .18);
  }
  .msg.me .bubble { background: linear-gradient(160deg, #4460ea, #3547c0); color: #fff; box-shadow: 0 2px 6px rgba(38, 60, 170, .35); }
  .tools { display: flex; gap: 4px; opacity: 0; transition: .15s; padding-left: 2px; }
  .msg:hover .tools { opacity: 1; }
  .tools button {
    background: transparent; border: 1px solid var(--line); color: var(--muted);
    border-radius: 7px; padding: 2px 7px; font-size: 11.5px;
  }
  .tools button:hover { color: #cfe0ff; border-color: var(--line-strong); background: #141d31; }
  .swipe { display: flex; align-items: center; gap: 4px; font-size: 11.5px; color: var(--muted); }

  .typing { display: flex; gap: 5px; align-items: center; color: var(--muted); font-size: 12px; padding-left: 42px; }
  .typing i { width: 5px; height: 5px; border-radius: 50%; background: #6b7ba3; display: inline-block; animation: blink 1.2s infinite; }
  .typing i:nth-child(2) { animation-delay: .2s; }
  .typing i:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%,80%,100% { opacity: .25 } 40% { opacity: 1 } }

  footer { flex: none; padding: 12px 20px 16px; border-top: 1px solid var(--line); background: var(--panel); }
  .composer {
    display: flex; gap: 10px; align-items: flex-end; background: var(--panel-2);
    border-radius: 14px; padding: 8px 10px; transition: box-shadow .18s cubic-bezier(.22,1,.36,1);
    box-shadow: 0 1px 2px rgba(3, 7, 18, .4), 0 10px 28px rgba(3, 7, 18, .22);
  }
  .composer:focus-within { box-shadow: 0 0 0 3px rgba(79,109,245,.28), 0 10px 28px rgba(3,7,18,.25); }
  .composer textarea {
    border: none; background: transparent; padding: 6px 4px; min-height: 24px; max-height: 150px;
    font-size: 13.5px; line-height: 1.6;
  }
  .composer textarea:focus { border: none; }
  .send {
    flex: none; height: 34px; padding: 0 16px; border: none; border-radius: 10px; color: #fff;
    background: linear-gradient(160deg, #5b78ff, #3d55d8); font-weight: 600; font-size: 13px;
  }
  .send:disabled { opacity: .45; cursor: default; }
  .hint { margin-top: 8px; font-size: 11px; color: #5c6a8c; display: flex; gap: 14px; }

  .modal {
    position: fixed; inset: 0; background: rgba(4,8,18,.66); backdrop-filter: blur(3px);
    display: none; align-items: center; justify-content: center; z-index: 20;
  }
  .modal.open { display: flex; }
  .card {
    width: min(620px, 92vw); max-height: 84vh; overflow-y: auto; background: #0f1728;
    border: 1px solid var(--line-strong); border-radius: 16px; padding: 20px;
    box-shadow: 0 24px 60px rgba(0,0,0,.55);
  }
  .card h3 { margin: 0 0 4px; font-size: 15px; }
  .card p.sub { margin: 0 0 14px; font-size: 12px; color: var(--muted); }
  .card .field { margin-bottom: 10px; }
  .card .actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; }
  .entry { display: flex; gap: 8px; align-items: flex-start; padding: 8px; border: 1px solid var(--line); border-radius: 10px; margin-bottom: 8px; background: var(--panel-2); }
  .entry .k { width: 120px; flex: none; }
  .entry .c { flex: 1; }
  .entry textarea { min-height: 46px; }
  .del { background: transparent; border: 1px solid #6b2b3b; color: #ff9aae; border-radius: 8px; padding: 4px 8px; }
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<aside>
  <div class="avatar" id="avatar" title="点击更换头像">🐋</div>
  <div class="name" id="charName">鲸鱼娘</div>
  <div class="tagline" id="charTagline">住在你桌面上的鲸鱼娘</div>
  <div class="hr"></div>
  <label class="field"><span>角色</span><select id="charSel"></select></label>
  <label class="field">
    <span>本地模型 <span id="modelHint" style="color:#5c6a8c">（7B 更像人，1.5B 更快更省显存）</span></span>
    <select id="modelSel"></select>
  </label>
  <div class="btn-row">
    <button class="btn" id="ttsBtn">🔊 朗读</button>
    <button class="btn" id="petBtn">🐳 同步</button>
  </div>
  <label class="field">
    <span>作者备注（常驻设定）</span>
    <textarea id="noteInput" placeholder="例如：今天主人加班很累，多关心他，少撒娇"></textarea>
  </label>
  <div class="btn-row">
    <button class="btn" id="worldBtn">🌍 世界书</button>
    <button class="btn" id="newCharBtn">＋ 角色</button>
  </div>
  <button class="btn" id="handoffBtn">📤 把这轮交给 DSH</button>
  <button class="btn ghost" id="clearBtn">🧹 清空对话</button>
  <div class="note">本地模型驱动，不消耗 token。<br/>用 *星号* 写动作描写；<br/>悬停气泡可「重生成 / 编辑 / 复制」。</div>
</aside>

<main>
  <header>
    <span class="dot"></span>
    <span class="title">与 <b id="headName">鲸鱼娘</b> 的对话 · 角色扮演</span>
    <span class="spacer"></span>
    <span class="chip" id="memChip" title="长期记忆条数">记忆 0</span>
    <span class="chip" id="modelChip">—</span>
  </header>
  <div id="log"></div>
  <footer>
    <div class="composer">
      <textarea id="input" rows="1" placeholder="和她说点什么…（Enter 发送，Shift+Enter 换行）"></textarea>
      <button class="send" id="send">发送</button>
    </div>
    <div class="hint"><span>Enter 发送</span><span>悬停可重生成/编辑</span><span>◀ ▶ 切换候选</span></div>
  </footer>
</main>

<div class="modal" id="worldModal">
  <div class="card">
    <h3>世界书 · 关键词触发设定</h3>
    <p class="sub">对话里出现关键词时，这段设定会自动注入到她的提示词里。</p>
    <div id="worldList"></div>
    <button class="btn" id="worldAdd">＋ 新增一条</button>
    <div class="actions">
      <button class="btn ghost" id="worldCancel">取消</button>
      <button class="btn on" id="worldSave">保存</button>
    </div>
  </div>
</div>

<div class="modal" id="charModal">
  <div class="card">
    <h3>角色卡</h3>
    <p class="sub">只影响本地聊天，不会改动桌宠本体。</p>
    <label class="field"><span>名字</span><input id="cfName" placeholder="例如：鲸鱼娘" /></label>
    <label class="field"><span>一句话简介</span><input id="cfTagline" placeholder="住在你桌面上的鲸鱼娘" /></label>
    <label class="field"><span>头像（emoji）</span><input id="cfAvatar" placeholder="🐋" maxlength="4" /></label>
    <label class="field"><span>人设（会作为 system 提示）</span><textarea id="cfCard" rows="7" placeholder="你是…"></textarea></label>
    <label class="field"><span>开场白</span><textarea id="cfGreeting" rows="2" placeholder="*趴在桌角探头看你* 忙完啦？"></textarea></label>
    <div class="actions">
      <button class="btn ghost" id="cfCancel">取消</button>
      <button class="btn on" id="cfSave">保存</button>
    </div>
  </div>
</div>

<script>
  const api = window.chatApi
  const el = id => document.getElementById(id)
  const logEl = el('log'), input = el('input'), sendBtn = el('send')
  let tts = true, petSync = true, busy = false
  let messages = []
  let currentAvatar = '🐋'
  let current = null, acc = '', pendingRegen = false

  const scroll = () => { logEl.scrollTop = logEl.scrollHeight }

  function renderEmpty() {
    if (messages.length) return
    logEl.innerHTML = ''
    const box = document.createElement('div')
    box.className = 'empty'
    box.innerHTML = '<div class="big">🐋</div><div class="line">' +
      (el('charTagline').textContent || '她在这儿等你').replace(/\n/g, '<br/>') +
      '</div><div class="line" style="opacity:.7">说点什么吧，她会用 *星号* 描述动作</div>'
    logEl.append(box)
  }

  function isImageAvatar(value) {
    return typeof value === 'string' && /[\\/.]/.test(value) && !/^\p{Emoji}/u.test(value)
  }

  function paintAvatar(node, value, size) {
    node.textContent = ''
    node.style.overflow = 'hidden'
    if (isImageAvatar(value)) {
      const img = document.createElement('img')
      img.src = value
      img.style.width = '100%'
      img.style.height = '100%'
      img.style.objectFit = 'cover'
      img.style.borderRadius = size === 'big' ? '22px' : '10px'
      node.append(img)
      return
    }
    node.textContent = value || '🐋'
  }

  function bubbleNode(index) {
    const item = messages[index]
    const wrap = document.createElement('div')
    wrap.className = 'msg' + (item.role === 'user' ? ' me' : '')
    const face = document.createElement('div')
    face.className = 'face'
    if (item.role === 'user') face.textContent = '你'
    else paintAvatar(face, currentAvatar, 'small')
    const col = document.createElement('div'); col.className = 'col'
    const bubble = document.createElement('div'); bubble.className = 'bubble'; bubble.textContent = item.content
    col.append(bubble)
    const tools = document.createElement('div'); tools.className = 'tools'
    const mk = (label, title, handler) => { const b = document.createElement('button'); b.textContent = label; b.title = title; b.onclick = handler; return b }
    tools.append(mk('⧉', '复制', () => navigator.clipboard.writeText(item.content)))
    if (item.role === 'assistant') {
      tools.append(mk('↻', '重新生成', () => regenerate(index)))
      if ((item.swipes || []).length > 1) {
        const sw = document.createElement('span'); sw.className = 'swipe'
        const counter = document.createElement('span'); counter.textContent = (item.swipe + 1) + '/' + item.swipes.length
        sw.append(mk('◀', '上一条候选', () => cycle(index, -1)), counter, mk('▶', '下一条候选', () => cycle(index, 1)))
        tools.append(sw)
      }
    }
    tools.append(mk('✎', '编辑（从这里继续）', () => editMessage(index)))
    col.append(tools)
    wrap.append(face, col)
    return wrap
  }

  function renderAll() {
    logEl.innerHTML = ''
    if (!messages.length) { renderEmpty(); return }
    messages.forEach((_, i) => logEl.append(bubbleNode(i)))
    scroll()
  }

  input.addEventListener('input', () => {
    input.style.height = 'auto'
    input.style.height = Math.min(input.scrollHeight, 150) + 'px'
  })
  input.addEventListener('keydown', event => {
    if (event.key === 'Enter' && !event.shiftKey) { event.preventDefault(); send() }
  })
  sendBtn.onclick = send

  function send() {
    const text = input.value.trim()
    if (!text || busy) return
    busy = true; sendBtn.disabled = true
    input.value = ''; input.style.height = 'auto'
    messages.push({ role: 'user', content: text })
    logEl.querySelector('.empty')?.remove()
    logEl.append(bubbleNode(messages.length - 1))
    typing(true); scroll()
    api.send(text, { tts, petSync })
  }

  function typing(show) {
    let node = el('typingRow')
    if (show) {
      if (node) return
      node = document.createElement('div'); node.id = 'typingRow'; node.className = 'typing'
      node.innerHTML = '鲸鱼娘正在想<i></i><i></i><i></i>'
      logEl.append(node); scroll()
    } else node?.remove()
  }

  api.onUser(text => {
    typing(false)
    const last = messages[messages.length - 1]
    if (!last || last.content !== text) {
      messages.push({ role: 'user', content: text })
      logEl.append(bubbleNode(messages.length - 1))
    }
    typing(true)
  })

  api.onChunk(text => {
    typing(false)
    if (!current) {
      if (pendingRegen) {
        current = logEl.lastElementChild
        const b = current && current.querySelector('.bubble')
        if (b) b.textContent = ''
      } else {
        messages.push({ role: 'assistant', content: '', swipes: [], swipe: 0 })
        current = bubbleNode(messages.length - 1)
        logEl.append(current)
        current.querySelector('.bubble').textContent = ''
      }
      acc = ''
    }
    acc += text
    const bubble = (current && current.querySelector('.bubble')) || current
    if (bubble) bubble.textContent = acc
    scroll()
  })

  api.onDone(fullText => {
    typing(false)
    if (pendingRegen) {
      const last = messages[messages.length - 1]
      if (last && last.role === 'assistant') {
        last.swipes = last.swipes && last.swipes.length ? last.swipes : [last.content]
        last.swipes.push(fullText || acc)
        last.swipe = last.swipes.length - 1
        last.content = last.swipes[last.swipe]
      }
      pendingRegen = false
    } else if (messages.length && messages[messages.length - 1].role === 'assistant') {
      const last = messages[messages.length - 1]
      if (!fullText) last.content = acc
      if (!String(last.content || '').trim()) messages.pop()
      else if (!(last.swipes || []).length) { last.swipes = [last.content]; last.swipe = 0 }
    }
    renderAll()
    current = null; acc = ''
    busy = false; sendBtn.disabled = false
    api.memory().then(list => { el('memChip').textContent = '记忆 ' + (list || []).length })
  })

  function regenerate(index) {
    if (busy) return
    busy = true; sendBtn.disabled = true
    pendingRegen = true; current = null; acc = ''
    typing(true)
    api.regenerate()
  }

  function cycle(index, delta) {
    const item = messages[index]
    if (!item || !(item.swipes || []).length) return
    item.swipe = (item.swipe + delta + item.swipes.length) % item.swipes.length
    item.content = item.swipes[item.swipe]
    renderAll()
  }

  async function editMessage(index) {
    const item = messages[index]
    const next = prompt('编辑这条消息（保存后会从这里继续）：', item.content)
    if (next === null) return
    const result = await api.edit(index, next)
    messages = (result.messages || []).map(m => ({ role: m.role, content: m.content, swipes: [m.content], swipe: 0 }))
    renderAll()
  }

  const charSel = el('charSel'), modelSel = el('modelSel')

  function paintCharacter(data) {
    if (!data) return
    el('charName').textContent = data.name || '鲸鱼娘'
    el('headName').textContent = data.name || '鲸鱼娘'
    el('charTagline').textContent = data.tagline || ''
    currentAvatar = data.avatar || '🐋'
    paintAvatar(el('avatar'), currentAvatar, 'big')
    el('noteInput').value = data.authorNote || ''
  }

  api.characters().then(info => {
    charSel.innerHTML = ''
    for (const item of info.list) {
      const option = document.createElement('option')
      option.value = item.id; option.textContent = item.name
      if (item.id === info.current) option.selected = true
      charSel.append(option)
    }
  })

  api.models().then(info => {
    modelSel.innerHTML = ''
    for (const name of info.candidates) {
      const option = document.createElement('option')
      option.value = name; option.textContent = name
      if (name === info.current) option.selected = true
      modelSel.append(option)
    }
    el('modelChip').textContent = info.current
  })

  api.history().then(data => {
    paintCharacter(data.character)
    messages = (data.messages || []).map(m => ({ role: m.role, content: m.content, swipes: [m.content], swipe: 0 }))
    if (!messages.length && data.character && data.character.greeting) {
      messages.push({ role: 'assistant', content: data.character.greeting, swipes: [data.character.greeting], swipe: 0 })
    }
    renderAll()
    api.memory().then(list => { el('memChip').textContent = '记忆 ' + (list || []).length })
  })

  charSel.onchange = async () => {
    const data = await api.setCharacter(charSel.value)
    paintCharacter(data.character)
    messages = (data.messages || []).map(m => ({ role: m.role, content: m.content, swipes: [m.content], swipe: 0 }))
    if (!messages.length && data.greeting) messages.push({ role: 'assistant', content: data.greeting, swipes: [data.greeting], swipe: 0 })
    renderAll()
  }
  modelSel.onchange = async () => { await api.setModel(modelSel.value); el('modelChip').textContent = modelSel.value }

  el('ttsBtn').onclick = () => { tts = !tts; el('ttsBtn').textContent = tts ? '🔊 朗读' : '🔇 朗读'; el('ttsBtn').classList.toggle('on', tts) }
  el('ttsBtn').classList.add('on')
  el('petBtn').onclick = () => { petSync = !petSync; el('petBtn').textContent = petSync ? '🐳 同步' : '🚫 同步'; el('petBtn').classList.toggle('on', petSync) }
  el('petBtn').classList.add('on')

  el('avatar').onclick = async () => {
    const result = await api.pickAvatar()
    if (result && result.ok) {
      currentAvatar = result.avatar
      paintAvatar(el('avatar'), currentAvatar, 'big')
      renderAll()
    }
  }

  el('noteInput').onblur = async () => { await api.saveNote(el('noteInput').value) }
  el('handoffBtn').onclick = async () => {
    const result = await api.handoff()
    el('handoffBtn').textContent = result && result.ok ? '✅ 已复制简报' : '⚠️ 复制失败'
    setTimeout(() => { el('handoffBtn').textContent = '📤 把这轮交给 DSH' }, 2200)
  }
  el('clearBtn').onclick = async () => { await api.clear(); messages = []; renderAll() }

  let worldEntries = []
  el('worldBtn').onclick = async () => {
    worldEntries = (await api.worldbook()) || []
    paintWorld(); el('worldModal').classList.add('open')
  }
  function paintWorld() {
    const list = el('worldList'); list.innerHTML = ''
    if (!worldEntries.length) list.innerHTML = '<div class="note" style="margin-bottom:10px">还没有条目。例如关键词「布丁」→「她最爱草莓布丁，提到会开心」</div>'
    worldEntries.forEach((entry, index) => {
      const row = document.createElement('div'); row.className = 'entry'
      row.innerHTML = '<input class="k" placeholder="关键词，逗号分隔" /><textarea class="c" placeholder="触发后注入的设定"></textarea><button class="del">删</button>'
      row.querySelector('.k').value = entry.keys || ''
      row.querySelector('.c').value = entry.content || ''
      row.querySelector('.k').oninput = e => { worldEntries[index].keys = e.target.value }
      row.querySelector('.c').oninput = e => { worldEntries[index].content = e.target.value }
      row.querySelector('.del').onclick = () => { worldEntries.splice(index, 1); paintWorld() }
      list.append(row)
    })
  }
  el('worldAdd').onclick = () => { worldEntries.push({ keys: '', content: '' }); paintWorld() }
  el('worldCancel').onclick = () => el('worldModal').classList.remove('open')
  el('worldSave').onclick = async () => {
    await api.saveWorldbook(worldEntries.filter(e => (e.keys || '').trim() && (e.content || '').trim()))
    el('worldModal').classList.remove('open')
  }

  el('newCharBtn').onclick = () => {
    el('cfName').value = ''; el('cfTagline').value = ''; el('cfAvatar').value = '🐋'; el('cfCard').value = ''; el('cfGreeting').value = ''
    el('charModal').classList.add('open')
  }
  el('cfCancel').onclick = () => el('charModal').classList.remove('open')
  el('cfSave').onclick = async () => {
    const payload = {
      name: el('cfName').value.trim() || '新角色',
      tagline: el('cfTagline').value.trim(),
      avatar: el('cfAvatar').value.trim() || '🐋',
      card: el('cfCard').value.trim(),
      greeting: el('cfGreeting').value.trim(),
    }
    if (!payload.card) { alert('人设不能为空'); return }
    const info = await api.saveCharacter(payload)
    el('charModal').classList.remove('open')
    charSel.innerHTML = ''
    for (const item of info.list) {
      const option = document.createElement('option')
      option.value = item.id; option.textContent = item.name
      if (item.id === info.current) option.selected = true
      charSel.append(option)
    }
    paintCharacter({ name: payload.name, tagline: payload.tagline, avatar: payload.avatar })
    messages = []; renderAll()
  }

  renderEmpty()
  input.focus()
</script>
</body>
</html>

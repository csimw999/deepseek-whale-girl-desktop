<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>鲸鱼娘</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent;
        user-select: none;
        -webkit-user-select: none;
      }
    </style>
  </head>
  <body>
    <script>
      // 早期错误收集：插件加载/挂载失败时由 overlay.js 回传给主进程落盘
      window.__petErrors = []
      window.addEventListener('error', event => {
        window.__petErrors.push(String((event && (event.message || event.error)) || 'unknown-error'))
      })
      window.addEventListener('unhandledrejection', event => {
        window.__petErrors.push('unhandledrejection: ' + String(event && event.reason))
      })
    </script>
    <script>
      // 像素形态的气泡：主进程的 petSay 在 Live2D 下走 DSHPet.report，这里给个降级实现
      window.__petSay = function (text) {
        try {
          let box = document.getElementById('__pixelSay')
          if (!box) {
            box = document.createElement('div')
            box.id = '__pixelSay'
            box.style.cssText = 'position:fixed;right:24px;bottom:340px;max-width:260px;padding:8px 12px;' +
              'border-radius:12px;background:rgba(19,28,54,.94);color:#e8edfa;font:13px/1.6 "Microsoft YaHei UI",sans-serif;' +
              'box-shadow:0 8px 24px rgba(0,0,0,.45);z-index:9999;pointer-events:none;transition:opacity .2s'
            document.body.append(box)
          }
          box.textContent = text
          box.style.opacity = '1'
          clearTimeout(window.__pixelSayTimer)
          window.__pixelSayTimer = setTimeout(() => { if (box) box.style.opacity = '0' }, 6000)
        } catch (error) {}
      }

      // 打断：像素形态也要能停掉正在播的语音
      window.__petStopAudio = function () {
        try {
          if (window.__petAudio) { window.__petAudio.pause(); window.__petAudio.currentTime = 0; window.__petAudio = null }
        } catch (error) {}
      }

      // 像素形态的语音播放：主进程会把完整 URL 传进来（/dsh-pet/voice/*.mp3）
      window.__petPlayUrl = function (url) {
        try {
          if (window.__petAudio) { window.__petAudio.pause(); window.__petAudio = null }
          const audio = new Audio(url)
          audio.volume = 0.75
          window.__petAudio = audio
          audio.play().catch(() => {})
        } catch (error) {}
      }
    </script>
    <!-- vendor.js：React 19 官方发行文件（tools/vendor-react.mjs 生成） -->
    <script src="./vendor.js"></script>
    <!-- 插件浏览器半区，原样拷贝自 @linxin666/dsh-pet 0.3.10 的 lib/client.js -->
    <script src="./plugin/dsh-pet-client.js"></script>
    <!-- WebView2 外壳：petShell 桥接（Electron 环境下自动跳过） -->
    <script src="./webview2-shell.js"></script>
    <!-- 假 DSH 宿主：/api/pet/* -->
    <script src="./host.js"></script>
    <!-- DSH 加载器 / ctx 外壳：运行插件 apply -->
    <script src="./loader.js"></script>
    <!-- 桌面命中测试 -->
    <script src="./overlay.js"></script>
  </body>
</html>
